[package]
name = "alas_native"
version = "0.1.0"
edition = "2024"
description = "Native helpers of ALAS"
publish = false

[lib]
name = "alas_native"
crate-type = ["cdylib"]

[dependencies]
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[profile.release]
lto = true
codegen-units = 1
