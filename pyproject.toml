[project]
name = "alas"
version = "0.0.0"
description = "AzurLaneAutoScript"
requires-python = ">=3.15,<3.16"
dependencies = [
    # Image processing
    "numpy>=2.5",
    "scipy>=1.18",
    "pillow>=13",
    # OpenCV 5 changed APIs, stay on 4.x until it is tested
    "opencv-python>=4.14,<5",
    "imageio>=2.38",
    # OCR runs the cnocr models with numpy, see module/ocr/crnn.py
    "threadpoolctl>=3.8",
    # Device connection
    # adbutils and uiautomator2 are pinned to the versions ALAS patches in
    # module/device/method/utils.py, uiautomator2 3.x removed atx-agent.
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "lxml>=6",
    "wrapt>=1.17",
    "retrying>=1.4",
    "decorator>=5",
    # No lz4 wheels for Python 3.15 yet, module/device/method/lz4_block.py falls back to pure Python
    "av>=19",
    "psutil>=7",
    "websockets>=17",
    # Utils
    "rich>=15",
    "tqdm>=4.70",
    "jellyfish>=1.3",
    "pyyaml>=6",
    "inflection>=0.5",
    "pydantic>=2.14",
    "filelock>=3.20,<4",
    "requests>=2.34",
    "cached-property>=1.5",
    "typing-extensions>=4.16",
    # Pushing
    "onepush>=1.11",
    "pycryptodome>=4.6",
    "pywin32>=312; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.uv]
package = false
# uiautomator2 2.16 caps packaging below 21, it only uses packaging.version which
# is unchanged since.
override-dependencies = ["packaging>=24"]

[tool.pytest.ini_options]
# Only tests/ holds the suite. Without this, a bare `pytest` walks the whole
# checkout: dev_tools/extract_tools/paddle_test.py and
# module/device/minitouch_test.py match the default `*_test.py` pattern but are
# scratch scripts that cannot be imported, so collection stopped with exit
# code 2 before a single test ran.
testpaths = ["tests"]
# Put the repository root on sys.path, so the tests import ``module`` and the
# screenshot plugin registers from tests/conftest.py, whichever pytest entry
# point is used. The ini option is applied before the initial conftests load.
pythonpath = ["."]
# Keep the temporary directory of the failed tests only, most of the suite uses
# tmp_path for the parcel fixtures and the screenshot lookups.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

# Lint of the Python code this fork owns (doc/governance ADR 0001). Upstream ALAS code is
# not linted here: it keeps its own style so merges stay clean. Run through dev_tools/check.sh.
[tool.ruff]
target-version = "py315"
line-length = 120
include = [
    "module/control/**/*.py",
    "module/ocr/crnn.py",
    "module/ocr/al_ocr.py",
    "module/device/method/lz4_block.py",
    "dev_tools/fake_worker.py",
    "tests/control/**/*.py",
    "tests/ocr/**/*.py",
    "tests/device/test_lz4_block.py",
]

[tool.ruff.lint]
# Pyflakes, syntax errors, bugbear, pylint errors, import order, syntax of current Python
select = ["F", "E9", "B", "PLE", "I", "UP"]
